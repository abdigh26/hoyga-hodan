<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages · Hoyga Hodan Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="assets/images/favicon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/fraunces/900.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/outfit/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/outfit/600.css">
<style>
  :root{ --cream:#F7EEDF; --crimson:#A81C2A; --ink:#24090D; --card:#FFFBF2; --amber:#E59A3A; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Outfit",system-ui,sans-serif;background:var(--cream);color:var(--ink);padding:48px clamp(20px,5vw,96px);line-height:1.6}
  h1{font-family:"Fraunces",Georgia,serif;font-weight:900;font-size:clamp(30px,4vw,44px);letter-spacing:-.02em;margin-bottom:6px}
  p.sub{color:var(--crimson);font-size:13px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;margin-bottom:34px}
  .access{max-width:540px;background:var(--card);border:1.5px solid var(--ink);padding:24px 26px;margin-bottom:30px;box-shadow:6px 6px 0 var(--crimson)}
  .access p{font-size:14px;margin-bottom:14px}.access label{display:block;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin-bottom:7px}.access-row{display:flex;gap:10px}.access input{flex:1;min-width:0;border:1.5px solid var(--ink);font:inherit;padding:10px 12px;background:#fffdf7}.access button{border:1.5px solid var(--ink);background:var(--crimson);color:#fff;font:inherit;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:10px 14px;cursor:pointer}.access button:hover{background:var(--ink)}
  .mcard{background:var(--card);border:1.5px solid var(--ink);padding:22px 26px;margin-bottom:16px;box-shadow:6px 6px 0 var(--crimson)}
  .mcard h3{font-family:"Fraunces",serif;font-size:20px;margin-bottom:4px}.meta{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:#8a6a55;margin-bottom:12px}.mcard p.msg{font-weight:300;white-space:pre-wrap}.empty{font-style:italic;color:#8a6a55}.error{color:var(--crimson);font-size:14px;margin-top:10px;display:none}
  a.home{display:inline-block;margin-top:34px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;border:1.5px solid var(--ink);padding:12px 22px;color:var(--ink);text-decoration:none}a.home:hover{background:var(--ink);color:var(--cream)}
  :focus-visible{outline:3px solid var(--amber);outline-offset:3px}@media(max-width:520px){.access-row{flex-direction:column}.access button{width:100%}}
</style>
</head>
<body>
<h1>Messages</h1>
<p class="sub">Contact form submissions · protected viewer</p>
<section class="access" aria-labelledby="accessTitle">
  <p id="accessTitle">Enter the private <code>ADMIN_TOKEN</code> configured in the Vercel project. The token is kept only in this browser session and is never included in a public link.</p>
  <label for="adminToken">Admin token</label>
  <div class="access-row"><input id="adminToken" type="password" autocomplete="current-password" placeholder="Enter admin token"><button id="loadMessages" type="button">Load messages</button></div>
  <p id="accessError" class="error" role="alert"></p>
</section>
<div id="list" aria-live="polite"><p class="empty">Enter the admin token to load messages.</p></div>
<a class="home" href="index.html">← Back to website</a>
<script>
  const tokenInput = document.getElementById('adminToken');
  const list = document.getElementById('list');
  const accessError = document.getElementById('accessError');
  const storedToken = sessionStorage.getItem('hoygaAdminToken');
  if (storedToken) tokenInput.value = storedToken;

  function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function renderMessages(messages){
    if(!messages || !messages.length){ list.innerHTML = '<p class="empty">No recent messages are available in this temporary viewer.</p>'; return; }
    list.innerHTML = messages.slice().reverse().map(function(m){
      return '<article class="mcard"><h3>'+escapeHtml(m.name)+'</h3><div class="meta">'+escapeHtml(m.email)+(m.org?' · '+escapeHtml(m.org):'')+(m.role?' · '+escapeHtml(m.role):'')+' · '+new Date(m.receivedAt).toLocaleString()+'</div><p class="msg">'+escapeHtml(m.message)+'</p></article>';
    }).join('');
  }
  const apiOrigin = window.location.hostname.endsWith('.github.io') ? 'https://hoyga-hodan.vercel.app' : '';
  async function loadMessages(){
    const token = tokenInput.value.trim();
    accessError.style.display = 'none';
    if(!token){ accessError.textContent = 'Enter the ADMIN_TOKEN first.'; accessError.style.display = 'block'; tokenInput.focus(); return; }
    list.innerHTML = '<p class="empty">Loading messages…</p>';
    try {
      const response = await fetch(apiOrigin + '/api/contact?list=1', { headers: {'x-admin-token': token}, cache: 'no-store' });
      if(!response.ok){
        if(response.status === 401) throw new Error('The token was not accepted. Check the ADMIN_TOKEN in Vercel and try again.');
        throw new Error('Messages could not be loaded right now.');
      }
      sessionStorage.setItem('hoygaAdminToken', token);
      renderMessages(await response.json());
    } catch(error) {
      list.innerHTML = '<p class="empty">No messages loaded.</p>';
      accessError.textContent = error.message; accessError.style.display = 'block';
    }
  }
  document.getElementById('loadMessages').addEventListener('click', loadMessages);
  tokenInput.addEventListener('keydown', function(event){ if(event.key === 'Enter') loadMessages(); });
</script>
</body>
</html>
